[Spellmaking & Enchantment]
description=Settings that affect Spellmaking
type=header

[Spellmaking Gold Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=3.0
Description=(Float) The Magicka cost of a spell is multiplied by this value to determine what the spell costs in Gold to buy or create. For spell merchants this cost is then modified by barter settings.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSpellmakingGoldMult
type=slider
value=3.0
MinValue=-20
MaxValue=20

[Constant Effect Magnitude Offset]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=5.0
Description=(Float) Value added to constant enchantment magnitude. | Formula: Magnitude = (SoulGemNumber 	* Constant Effect Enchantment Factor 	* Base Cost) + fMagicCEEnchantMagOffset
LoadOnBoot=IfChanged
Step=0.1
VarName=fMagicCEEnchantMagOffset
type=slider
value=5.0
MinValue=-200
MaxValue=200

[Enchantment Gold Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=10.0
Description=(Float) Multiplier used to calculate the amount of gold to be paid for an enchantment.
LoadOnBoot=IfChanged
Step=0.1
VarName=fEnchantmentGoldMult
type=slider
value=10.0
MinValue=-200
MaxValue=200

[Enchantment Points Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.40
Description=(Float) Multiplier used to calculate the gold value added to an enchanted item. | Formula: Max_Charge 	* fEnchantmentPointsMult + Cost_to_Use 	* fEnchantmentEffectPointsMult
LoadOnBoot=IfChanged
Step=0.1
VarName=fEnchantmentPointsMult
type=slider
value=0.40
MinValue=-200
MaxValue=200

[Recharge Gold Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=2.0
Description=(Float) Multiplier used to calculate the recharge cost for any enchanted item when taken to an enchanter service. | Formula: (Charge_Max-Charge_Current) 	* fRechargeGoldMult
LoadOnBoot=IfChanged
Step=0.1
VarName=fRechargeGoldMult
type=slider
value=2.0
MinValue=-200
MaxValue=200

