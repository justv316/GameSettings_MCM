MaxValue=100

[Chameleon Max Refraction]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.00
Description=(Float) The chameleon visual is an applied refraction to the model. The degree of refraction is specified by two variables fChameleonMaxRefraction and fChameleonMinRefraction. The maximum refraction value is mapped to a chameleon setting of 1. The minimum refaction value is mapped to a chameleon setting of 100. Values that exceed 1.0 run the risk of having certain polygons become totally transparent. In practice, there is not much visual difference in the scale.
LoadOnBoot=IfChanged
Step=0.05
VarName=fChameleonMaxRefraction
type=slider
value=1.0
MinValue=0
MaxValue=100

[Chameleon Min Refraction]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.0100
Description=(Float) The chameleon visual is an applied refraction to the model. The degree of refraction is specified by two variables fChameleonMaxRefraction and fChameleonMinRefraction. The maximum refraction value is mapped to a chameleon setting of 1. The minimum refaction value is mapped to a chameleon setting of 100. Values that exceed 1.0 run the risk of having certain polygons become totally transparent. In practice, there is not much visual difference in the scale.
LoadOnBoot=IfChanged
Step=0.005
VarName=fChameleonMinRefraction
type=slider
value=0.01
MinValue=0
MaxValue=100

