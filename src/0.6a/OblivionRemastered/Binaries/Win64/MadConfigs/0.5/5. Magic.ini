[Uncategorized Magic]
description=Uncategorized Magic Settings
type=header

[Leveled Magnitude Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.250
Description=(Float) Multiplier for level-based magic effects like Turn Undead, Frenzy, Calm, Command etc. This is the reason why you can't create any spells with a level-magnitude over 25. The maximum magnitude of any spell that is created by spellmaking is limited to 100. This multiplier will turn 100 into 25. Change the value to 1 to allow the creation of level-based spell to effect target's up to level 100. Changing it will alter every existing spell/enchantment.
LoadOnBoot=IfChanged
Step=0.05
VarName=fMagicLevelMagnitudeMult
type=slider
value=0.250
MinValue=0
MaxValue=100

[Leveled Magnitude Affect All]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=25
Description=(Integer) This value affects the level at which spells with a magnitude (command humanoid, calm, etc.) will affect creatures of all levels. The default setting is 25 (since the in-game spellmaking/enchanting altars stop at magnitude 25).
LoadOnBoot=IfChanged
Step=1
VarName=iMagnitudeLevelAffectsAll
type=slider
value=25
MinValue=0
MaxValue=100

[Units Per Foot]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=22.0
Description=(Float) Oblivion uses a coordinate system with 'units' as the base form of measurement. When calculating areas of effect, Oblivion uses fMagicUnitsPerFoot to convert the 'feet' attribute of the area of effect into the equivalent units. The default value is 22.0000.
LoadOnBoot=IfChanged
Step=0.5
VarName=fMagicUnitsPerFoot
type=slider
value=22.0
MinValue=0
MaxValue=100

[Maximum Summoned Creatures]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1
Description=(Integer) This is the number of summoned creatures the player can control at any one time.
LoadOnBoot=IfChanged
Step=1
VarName=iMaxPlayerSummonedCreatures
type=slider
value=1
MinValue=0
MaxValue=100