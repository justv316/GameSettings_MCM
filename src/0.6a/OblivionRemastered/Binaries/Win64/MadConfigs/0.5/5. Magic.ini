[Disease]
description=Settings that affect Disease.
type=header

[Disease Transfer Base]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.0
Description=(Float) The base chance that an actor will contract a disease when struck by an infected attacker. Increasing this value allows actors with 100% disease resistance to contract diseases; decreasing it gives 100% protection against disease to actors with less than 100 disease resistance.
LoadOnBoot=IfChanged
Step=0.5
VarName=fMagicDiseaseTransferBase
type=slider
value=0.0
MinValue=-100
MaxValue=100

[Disease Transfer Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.250
Description=(Float) This value is multiplied by an actor's Resist Disease attribute to determine the chance that the actor will contract a disease when struck by an infected attacker.
LoadOnBoot=IfChanged
Step=0.05
VarName=fMagicDiseaseTransferMult
type=slider
value=0.0
MinValue=0
MaxValue=100

[Sun Damage Hidden Scale]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.20
Description=(Float) Modifer used in the calculation of taking damage from the sun. This setting reduces damage to the character should the direct rays of sun be hidden behind terrain or clouds.
LoadOnBoot=IfChanged
Step=0.05
VarName=fMagicSunDamageSunHiddenScale
type=slider
value=0.20
MinValue=0
MaxValue=100

[Sun Damage Water Scale]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.20
Description=(Float) Used in the calculation for taking damage from the sun. This setting will reduce sun damage for being submerged under water.
LoadOnBoot=IfChanged
Step=0.05
VarName=fMagicSunDamageWaterScale
type=slider
value=0.20
MinValue=0
MaxValue=100

