[Obsolete Stealth Settings]
description=Settings that have been found to have no current function in ObRe.
type=header

[Sneak Attack Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=4.0
Description=(Float) Multiplies the base attack by this value before applying the damage to an enemy. It is activated when a player initiates an attack while in sneak mode, thus the "Sneak Attack x#" message when you perform a sneak attack on an enemy. This value is a base value for sneak attacks and is further modified by a character's sneak skill, weapon type (melee or ranged), attack direction (front, back, side, sleep), and attack type (normal or power). Each of these modifiers has its own setting.
LoadOnBoot=IfChanged
Step=0.1
VarName=fDamageSneakAttackMult
type=slider
value=4.0
MinValue=-100
MaxValue=100

