[Physics]
description=Settings that affect Physics.
type=header

[Object Weapon Reach]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=150.00
Description=(Float) Dictates how far ALL weapons reach to hit any object such as a tree. Unlike hitting actors, Weapon Range will not effect how far you can reach with your weapon to hit objects.
LoadOnBoot=IfChanged
Step=1
VarName=fObjectHitWeaponReach
type=slider
value=150.00
MinValue=-100
MaxValue=3000

[Grab Power]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=2.00
Description=(Float) Controls the amount of power the player has when manipulating objects with the Grab key (default: Z). Increasing this number increases the rate at which an object can be moved using the grab key.
LoadOnBoot=IfChanged
Step=0.1
VarName=fGrabPower
type=slider
value=2.00
MinValue=-100
MaxValue=300

[Arrows]
description=Settings that affect Arrow Physics.
type=header

[Age Maximum]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=90.00
Description=(Float) The number of seconds an arrow remains on the ground, or stuck into a world object, after impact. This setting does not apply to arrows striking an actor, these arrows remain in the actor's inventory until removed (sold, used, stolen, removed by script, etc). Recovery chance is determined by IArrowInventoryChance.
LoadOnBoot=IfChanged
Step=1
VarName=fArrowAgeMax
type=slider
value=90.00
MinValue=-100
MaxValue=300

[Bounce Speed]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.10
Description=(Float) This controls the speed at which arrows bounce back (i.e., if you set this to 1.0000, and shoot an arrow at a stone wall, the arrow will bounce back at you at the same speed it was fired). Setting this to 0.5000 will set it to bounce back at 1/2 speed. Setting it to 0 will (in theory) stop it from bouncing back.
LoadOnBoot=IfChanged
Step=0.05
VarName=fArrowBounceLinearSpeed
type=slider
value=0.10
MinValue=-100
MaxValue=300

[Bounce Rotatation Speed]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=7.5
Description=(Float) This setting controls how much the arrow rotates after it bounces off of something (i.e., if you set this to 0.0500, the arrow will not rotate very much after bouncing off something).
LoadOnBoot=IfChanged
Step=0.5
VarName=fArrowBounceRotateSpeed
type=slider
value=7.5
MinValue=-100
MaxValue=300

[Fake Mass]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.25
Description=(Float) How "heavy" an arrow is considered to be for purposes of calculating havoc functions. Probably used mostly when arrows impact havoc objects.
LoadOnBoot=IfChanged
Step=0.05
VarName=fArrowFakeMass
type=slider
value=0.25
MinValue=-100
MaxValue=300

[Zoom Speed]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.250
Description=(Float) It is an increment (or decrement) of some sort that affects zoom speed.
LoadOnBoot=IfChanged
Step=0.05
VarName=fArrowFOVTimeChange
type=slider
value=0.250
MinValue=-100
MaxValue=300

[Zoom Start]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=2.750
Description=(Float) It is believed to be the base value for zooming speed. See fArrowFOVTimeChange to determine how zooming can be speed up.
LoadOnBoot=IfChanged
Step=0.05
VarName=fArrowFOVTimeStart
type=slider
value=2.750
MinValue=-100
MaxValue=300

[Zoom FOV]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=30.0
Description=(Float) This is the FOV setting towards which the current FOV is adjusted (and where it stops). See fArrowFOVTimeStart and fArrowFOVTimeChange to determine the speed of zoom effect.
LoadOnBoot=IfChanged
Step=0.5
VarName=fArrowFOVZoom
type=slider
value=30.0
MinValue=-100
MaxValue=300

[Gravity Base]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.30
Description=(Float) Believed to be the base force pulling the arrow towards the ground - for arc calculation. The smaller the value, the staighter the arrow's arc.
LoadOnBoot=IfChanged
Step=0.05
VarName=fArrowGravityBase
type=slider
value=0.30
MinValue=-100
MaxValue=300

[Gravity Minimum]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.050
Description=(Float) Changing this setting did not appear to do anything to arrows. While keeping the gravity multiplier at the same setting, going from a GravityMin value of 0.001 to 90,000 did nothing to change the arc of the arrow.
LoadOnBoot=IfChanged
Step=0.005
VarName=fArrowGravityMin
type=slider
value=0.050
MinValue=-100
MaxValue=300

[Gravity Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.0020
Description=(Float) This multiplier determines the gravity on arrows. If you increase this amount, arrows will fly straight for a longer period of time. If you decrease the amount, arrows will go straight for a much shorter period of time.
LoadOnBoot=IfChanged
Step=0.0005
VarName=fArrowGravityMult
type=slider
value=0.0020
MinValue=-100
MaxValue=300

[Speed Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1500
Description=(Float) The base speed at which fired arrows fly in units/sec. | Formula: (Speed prop. of Arrow) * fArrowSpeedMult * (fArrowWeakSpeed + (1 - fArrowWeakSpeed)*DrawMult |  DrawMult = fArrowBowTimerBase + fArrowBowTimerMult * DrawTime  ,  or 1.0 (whichever is less)
LoadOnBoot=IfChanged
Step=5
VarName=fArrowSpeedMult
type=slider
value=1500
MinValue=-10000
MaxValue=30000

[Bow Timer Base]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.250
Description=(Float) The speed of arrows that haven't been drawn back all of the way.
LoadOnBoot=IfChanged
Step=0.005
VarName=fArrowBowTimerBase
type=slider
value=0.250
MinValue=-100
MaxValue=300

[Bow Timer Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.400
Description=(Float) Determines the rate at which the arrow is drawn back while the fire button is held. 
LoadOnBoot=IfChanged
Step=0.005
VarName=fArrowBowTimerMult
type=slider
value=0.400
MinValue=-100
MaxValue=300

[Weak Gravity]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.750
Description=(Float) This setting determines the gravity effect on arrows that haven't been held back for the proper length of time (not a power shot). Decreasing this setting means that your "weak" arrows will have a straighter arc than normal (travel in a straight line for a longer period of time).
LoadOnBoot=IfChanged
Step=0.005
VarName=fArrowWeakGravity
type=slider
value=1.750
MinValue=-100
MaxValue=300

[Weak Speed]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.010
Description=(Float) Determines the minimum speed, as a fraction of the base speed, for arrows that aren't drawn back all of the way. See the full speed formula for details.
LoadOnBoot=IfChanged
Step=0.005
VarName=fArrowWeakSpeed
type=slider
value=0.010
MinValue=-100
MaxValue=300

[Inventory Chance]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=50
Description=(Integer) The percent chance that an arrow that struck its target will be added to the target's inventory.
LoadOnBoot=IfChanged
Step=1
VarName=iArrowInventoryChance
type=slider
value=50
MinValue=0
MaxValue=300

[Maximum Reference Count]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=15
Description=(Integer) The maximum number of Arrow References that are kept track of in a cell caused by rebounding arrows.
LoadOnBoot=IfChanged
Step=1
VarName=iArrowMaxRefCount
type=slider
value=15
MinValue=0
MaxValue=300

[Death Force]
description=Settings that affect Death Force.
type=header

[Minimum Death Force]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=35.0
Description=(Float) This, along with fDeathForceForceMax, determines how much force is allowed when someone dies.
LoadOnBoot=IfChanged
Step=0.5
VarName=fDeathForceForceMin
type=slider
value=35.0
MinValue=0
MaxValue=3000

[Maximum Death Force]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=85.0
Description=(Float) This, along with fDeathForceForceMin, determines how much force is allowed when someone dies.
LoadOnBoot=IfChanged
Step=0.5
VarName=fDeathForceForceMax
type=slider
value=85.0
MinValue=0
MaxValue=3000

[Explosion Force]
description=Settings that affect Explosion Force.
type=header

[Minimum Force]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.0
Description=(Float) Like fMagicExplosionPowerMax, this value seems to deal with the minimum force applied to an actor with magic. The game will use this absolute minimum if a calculated value falls below this range.
LoadOnBoot=IfChanged
Step=0.5
VarName=fMagicExplosionPowerMin
type=slider
value=0.0
MinValue=0
MaxValue=3000

[Maximum Force]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=100.0
Description=(Float) This value has to do with the maximum "kick" an explosion of magic uses. This is how far an actor of any type will be moved by magic. This seems to only affect actors that are dead or paralyzed. This also seems to affect movable in-game items, however they accelerate at a much greater distance and speed, so weight must be a factor too. This value is used as a maximum upper end if the game calculates a higher value. (My value is 128.000 which seems to be more than sufficient.)
LoadOnBoot=IfChanged
Step=0.5
VarName=fMagicExplosionPowerMax
type=slider
value=100.0
MinValue=0
MaxValue=3000

[Force Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.40
Description=(Float) This setting is likely part of a formula the game uses to determine what "kick" a magic bolt or explosion has. The formula appears to be based on: The damage the spell does, the area of the spell, this value, and the weight of the object. This only seems to work when the target is paralyzed, dead, or a moveable object.
LoadOnBoot=IfChanged
Step=0.05
VarName=fMagicExplosionPowerMult
type=slider
value=0.40
MinValue=0
MaxValue=3000

[Buoyancy]
description=Settings that affect Buoyancy.
type=header

[Water]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.00
Description=(Float) A reference value. It sets the buoyancy of water. Setting it to 1.0000 makes everything sink. Setting it to -1.0000 makes everything float and could possibly induce a permanent "water-walk" effect for all characters. All of the fBuoyancy settings control the buoyancy (how fast or slow an object will sink when dropped in a pool of water) of some type of material in the game. A setting of -1.000 means the material will sink immediately to the bottom of the water. A setting of 0.000 means the material will slowly settle into a mid-level height in the water. A setting of +1.000 means the material will float on top of the water. Other values control the speed at which the material will sink and the height at which it floats.
LoadOnBoot=IfChanged
Step=0.05
VarName=fBuoyancyWater
type=slider
value=0.00
MinValue=-5
MaxValue=5

