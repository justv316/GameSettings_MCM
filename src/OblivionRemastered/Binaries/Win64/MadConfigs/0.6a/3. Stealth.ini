[Sneak Mechanics]
description=Settings that affect Sneak Mechanics
type=header

[Base Value]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-25.0
Description=(Float) This is the base value that all modifiers are added to for detection. Changing this value alters the fundamental effectiveness of sneaking. Higher values mean it's harder to sneak, lower values mean it's easier to sneak.
LoadOnBoot=IfChanged
Step=0.5
VarName=fSneakBaseValue
type=slider
value=-25.0
MinValue=-100
MaxValue=100

[Skill Use Distance]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1000
Description=(Integer) If the player is sneaking within this distance from another actor (NPC, creature) and the player is undetected then the player is actively using the sneak skill and it will eventually increase. If there are no actors within this distance of the player then the use of sneak does not count towards increasing the sneak skill.
Step=10
VarName=iSneakSkillUseDistance
type=slider
value=1000
MinValue=-10000
MaxValue=10000

[Max Distance]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1500.00
Description=(Float) Maximum distance that an actor will detect another actor in an interior cell. Anything out of this range does not take part in sneak rolls vs. the sneaking actor. E.g. cannot be detected (not even if the sneaking player attacks). While the actor is in an exterior cell, this value is multiplied by fSneakExteriorDistanceMult.
LoadOnBoot=IfChanged
Step=10
VarName=fSneakMaxDistance
type=slider
value=1500.0
MinValue=-10000
MaxValue=10000

[Exterior Distance Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=2.00
Description=(Float) The maximum distance that detection will operate is different for exteriors and interiors. The interior value is set by fSneakMaxDistance. That value is multipiied by fSneakExteriorDistanceMult to determine exterior ranges for detection.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSneakExteriorDistanceMult
type=slider
value=2.0
MinValue=-10
MaxValue=10

[Light Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.40
Description=(Float) This multiplier is applied to all the light based aspects of detection. It is used to regulate the relative weight of light vs. sound vs. skill in calculating the final detection value. The higher the value, the easier an actor detects another based on the light conditions.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSneakLightMult
type=slider
value=1.40
MinValue=-10
MaxValue=10

[Unseen Minimum]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.00
Description=(Float) This is the threshold value at which the actor fades out of sight and cannot be targeted for combat (or anything else) by other actors. This is true only however when the actor is trying to sneak around a non-hostile actor. If the actor is hostile, fSneakLostMin is used instead.
Step=0.1
VarName=fSneakUnseenMin
type=slider
value=0.00
MinValue=-10
MaxValue=10

[Seen Minimum]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.0
Description=(Float) This is the threshold value at which the actor fades into sight and can be targeted for combat (or anything else) by other actors. When the actor attacked the sneaking actor, the sneaking actor remains visible until the value falls below fSneakLostMin. When the actor did not attack (the actor seeing You is not hostile, You did not attack or steal anything), the sneaking actor remains visible until the value falls below FSneakUnseenMin - this latter part is to be tested and confirmed.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSneakSeenMin
type=slider
value=0.0
MinValue=-10
MaxValue=10

[Skill Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.50
Description=(Float) This is the multiplier applied to the relative skill values of the actors. It is used to regulate the relative weight of light vs. sound vs. skill in the detection calculations.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSneakSkillMult
type=slider
value=0.50
MinValue=-10
MaxValue=10


[Boot Weight Base]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=14.00
Description=(Float)This is the base penalty to sneaking for wearing boots of any sort. The modified weight of the boots is also factored in using fSneakBootWeightMult.
LoadOnBoot=IfChanged
Step=0.5
VarName=fSneakBootWeightBase
type=slider
value=14.0
MinValue=-100
MaxValue=100

[Boot Weight Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.00
Description=(Float) This is the multiplier to the actor's boot weight used to modify sneaking. Just wearing boots modifies the sneak value, regardless of their weight or type, by the value of fSneakBootWeightBase.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSneakBootWeightMult
type=slider
value=1.0
MinValue=-100
MaxValue=100

[Running Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.300
Description=(Float) This multiplier is applied to the boot weight and other sound penalties if the actor is running.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSneakRunningMult
type=slider
value=1.300
MinValue=-10
MaxValue=10

[Sleep Bonus]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-10.0
Description=(Float) Determines the Sneak bonus an actor gets if the target is sleeping.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSneakSleepBonus
type=slider
value=-10
MinValue=-100
MaxValue=100

[Sound LOS Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.0
Description=(Float) This multiplier is applied to the sound portion of the detection system if the actor does not have line of sight (LOS) to the hiding actor.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSneakSoundLosMult
type=slider
value=1.0
MinValue=-10
MaxValue=10

[Sound Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.6
Description=(Float) This multiplier governs the importance of sounds (and sounds only) made during sneaking. The higher it is, the harder the sneaking will be because you have to make less noise. For example, 0 means that sounds have no effect at all, while 1 means that sounds have normal effect.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSneakSoundsMult
type=slider
value=1.6
MinValue=-10
MaxValue=10

[Swimming Light Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.5
Description=(Float) This multiplier is applied to swimming actors, but only to the light portion of the detection system.
LoadOnBoot=IfChanged
Step=0.1
VarName=fSneakSwimmingLightMult
type=slider
value=0.5
MinValue=-10
MaxValue=10

[Target Detection Bonus]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=100.00
Description=(Float) An actor that is the direct target of an attack gets this bonus to detect their attacker.
LoadOnBoot=IfChanged
Step=1
VarName=fSneakTargetAttackBonus
type=slider
value=100.00
MinValue=-1000
MaxValue=1000

[Combat Detection Bonus]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=25.00
Description=(Float) Any actor in combat, but not in combat with the detecting actor, has this penalty applied for sneaking.
Step=1
VarName=fSneakTargetInCombatBonus
type=slider
value=25.00
MinValue=-1000
MaxValue=1000

[AI Combat Minimum Detection]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-50
Description=(Integer) When an actor is in combat, the detection value has to fall below this number for the actor to lose track of their target.
Step=1
VarName=iAICombatMinDetection
type=slider
value=-50
MinValue=-100
MaxValue=100

[Detection Timer]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.3
Description=(Float) This value represents how often in seconds an actor makes detection checks against all other actors within the max detection distance.
Step=0.1
VarName=fDetectionTimerSetting
type=slider
value=0.30
MinValue=-10
MaxValue=10

[Detection Light Modifier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-5.0
Description=(Float) This value is added to the light level on a target during Detection calculations.
Step=0.1
VarName=fDetectionSneakLightMod
type=slider
value=-5.0
MinValue=-10
MaxValue=10

[Detection Night Eye Bonus]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=3.0
Description=(Float) Bonus multiplier to the light level on nearby actors during detection checks.
Step=0.1
VarName=fDetectionNightEyeBonus
type=slider
value=3.0
MinValue=-10
MaxValue=10

[Crime Mechanics]
description=Settings that affect Crime
type=header

[Disposition Attack]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-10.0
Description=(Float) Witnessing a crime may affect an NPC's disposition to the criminal. This is the modifier to disposition that happens when an NPC witnesses an attack on someone they like. If the attack is against the NPC, the modifier is multiplied by fCrimeDispPersonal first, which increases the disposition penalty.
Step=0.1
VarName=fCrimeDispAttack
type=slider
value=-10.0
MinValue=-100
MaxValue=100

[Disposition Murder]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-50.0
Description=(Float) Witnessing a crime may affect an NPC's disposition to the criminal. This is the modifier to disposition that happens when an NPC witnesses the murder of someone they like.
Step=0.1
VarName=fCrimeDispMurder
type=slider
value=-50.0
MinValue=-100
MaxValue=100

[Disposition Pickpocket]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-25.0
Description=(Float) Witnessing a crime may affect an NPC's disposition to the criminal. This is the modifier to disposition that happens when an NPC witnesses pickpocking against someone they like. If the NPC is the one being pickpocketed, the modifier is multiplied by fCrimeDispPersonal first, which increases the disposition penalty.
Step=0.1
VarName=fCrimeDispPickpocket
type=slider
value=-25.0
MinValue=-100
MaxValue=100

[Disposition Steal]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-0.5
Description=(Float) Witnessing a crime may affect an NPC's disposition to the criminal. This is the multiplier used to modify an NPC's disposition when he witnesses a theft of someone's property that they like. This value multiplied by the gold value of the item stolen to make the modifier. If the theft is against the NPC, the modifier is multiplied by fCrimeDispPersonal first, which increases the disposition penalty.
Step=0.1
VarName=fCrimeDispSteal
type=slider
value=-0.5
MinValue=-100
MaxValue=100

[Disposition Steal]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-20.0
Description=(Float) Witnessing a crime may affect an NPC's disposition to the criminal. This is the modifier to disposition that happens when an NPC witnesses trespassing against someone they like. If the trespass is against the NPC, the modifier is multiplied by fCrimeDispPersonal first, which increases the disposition penalty.
Step=0.1
VarName=fCrimeDispTresspass
type=slider
value=-20.0
MinValue=-100
MaxValue=100

[Disposition Personal]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=2.00
Description=(Float) If the NPC is the victim of the crime, the disposition penalty is multiplied by this setting. For example, witnessing an assault is a -10 disposition penalty toward the criminal. However, being the victim of assault is a -20 penalty (-10 time 2.0).
Step=0.1
VarName=fCrimeDispPersonal
type=slider
value=2.0
MinValue=-100
MaxValue=100

[Gold Steal]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.50
Description=(Float) Acts as a multiplier to the value of the stolen item in calculating the fine for theft. Formula: is Crime Gold = itemValue * fCrimeGoldSteal.
Step=0.1
VarName=fCrimeGoldSteal
type=slider
value=0.50
MinValue=-10
MaxValue=10

