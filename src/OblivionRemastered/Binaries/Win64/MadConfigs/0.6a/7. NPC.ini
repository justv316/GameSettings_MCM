[AI]
description=Settings that have affect AI.
type=header

[Talk to NPC Timer]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=60.0
Description=(Float) Time in seconds that an NPC will wait after conversation with a NPC before it will attempt another conversation.
LoadOnBoot=IfChanged
Step=0.5
VarName=fAITalktoNPCTimer
type=slider
value=60.0
MinValue=0
MaxValue=300

[Talk to Same NPC Timer]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=120.0
Description=(Float) Time in seconds that a NPC will wait before engaging in a conversation with the last NPC to which it spoke.
LoadOnBoot=IfChanged
Step=0.5
VarName=fAITalktoSameNPCtimer
type=slider
value=120.0
MinValue=0
MaxValue=300

[Maximum Wander Time]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=100.0
Description=(Float) Maximum time an actor walks continuously during a wander package, in seconds. After this time they will go idle for some time (probably governed by another setting). Setting this to 0 will make actors walk continuously, except when engaging in conversations with other NPC.
LoadOnBoot=IfChanged
Step=0.5
VarName=fAIMaxWanderTime
type=slider
value=100.0
MinValue=0
MaxValue=3000

[Flee Chance Base]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=30.0
Description=(Float) The base chance that an opponent will flee in combat. It is modified by the opponent's confidence and health. | Formula: fAIFleeConfBase + (Confidence * fAIFleeConfMult) + (unknown health factor * fAIFleeHealthMult)
LoadOnBoot=IfChanged
Step=0.5
VarName=fAIFleeConfBase
type=slider
value=30.0
MinValue=0
MaxValue=100

[Flee Chance Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-0.5
Description=(Float) A multiplier on confidence. Raising it makes NPCs less likely to flee.
LoadOnBoot=IfChanged
Step=0.5
VarName=fAIFleeConfMult
type=slider
value=-0.5
MinValue=0
MaxValue=100

[Flee Health Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=10.0
Description=(Float) The effect that damage has on the AI's chance to flee. Raising this parameter causes loss of health to have a greater effect on the AI and make them more likely to flee when suffering damage.
LoadOnBoot=IfChanged
Step=0.5
VarName=fAIFleeHealthMult
type=slider
value=10.0
MinValue=0
MaxValue=100

[Alert Allowed]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0
Description=(Integer) Seems to have massive consequences. For instance some triggered events don't work properly because the actors might be called into action to fight, and it also seems to work for animals, not just humans. Set to 1 to increase the chance that attacking an actor will alert their nearby friends
LoadOnBoot=IfChanged
Step=1
VarName=iAIDefaultMeleeAlertAllowed
type=slider
value=0
MinValue=0
MaxValue=1

[Power Attack Chance]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=20
Description=(Integer) Chance that an enemy will use the Backward Power Attack. Setting to 100 doesn't seem to make every attack a Backwards Power Attack. For instance, when the enemy runs towards you they will still use a normal attack, and will also occasionally (maybe 1/10) use normal attacks. Most likely, there's a formula used to determine if the enemy will use a normal or power attack, and if it's a power attack this (and the other Power Attack chances) determine which Power Attack is used.
LoadOnBoot=IfChanged
Step=1
VarName=iAIDefaultPowerAttackBackwardChance
type=slider
value=20
MinValue=0
MaxValue=100

[Race Power Chance]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=5
Description=(Integer) Appears to be the chance an NPC will use their race power in battle. For instance, a Dark Elf will use "Summon Ancestral Guardian" in combat.
LoadOnBoot=IfChanged
Step=1
VarName=iAINPCRacePowerChance
type=slider
value=5
MinValue=0
MaxValue=100

