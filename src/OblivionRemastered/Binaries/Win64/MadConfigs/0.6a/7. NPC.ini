[Blink]
description=Settings that have affect Blinking.
type=header

[Maximum Delay]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=4.0
Description=(Float) Blinking occurs randomly on all NPC's, as well as the player. The amount of time between each "Blink event" is a random number between the minimum delay setting, and the maximum delay setting. Increasing this setting will mean longer periods between blinks (depending on the Max delay variable above) Also realize that, unlike most animations, this time setting will not be affected by the fGlobalTimeMultiplier in the Oblivion.ini file. 1.5 Seconds minimum is always 1.5 seconds, even if the world is moving in slow motion.
LoadOnBoot=IfChanged
Step=0.1
VarName=fBlinkDelayMax
type=slider
value=4.0
MinValue=0
MaxValue=100

[Minimum Delay]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.5
Description=(Float) Blinking occurs randomly on all NPC's, as well as the player. The amount of time between each "Blink event" is a random number between the minimum delay setting, and the maximum delay setting. Increasing this setting will mean longer periods between blinks (depending on the Max delay variable above) Also realize that, unlike most animations, this time setting will not be affected by the fGlobalTimeMultiplier in the Oblivion.ini file. 1.5 Seconds minimum is always 1.5 seconds, even if the world is moving in slow motion.
LoadOnBoot=IfChanged
Step=0.1
VarName=fBlinkDelayMin
type=slider
value=1.5
MinValue=0
MaxValue=100

[Down Time]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.2
Description=(Float) This refers to how long in seconds it takes for the character's eyelids to go from up to down, and stay down. The time value is means that the eye will stay closed for about 0.1 seconds, and the speed of the eyelid from up to down will be 0.1 seconds (about half the time each). Increasing this value means that the character will take longer to close their eyelids, and the eyelids will stay down longer as well. How long it takes to complete one blink does not seem to matter to the Min and Max blinking time variables - if it takes 15 seconds to blink once, the timer that determines when the next blink will take place will only start once blinking has commenced.
LoadOnBoot=IfChanged
Step=0.01
VarName=fBlinkDownTime
type=slider
value=0.2
MinValue=0
MaxValue=100

[Up Time]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.17
Description=(Float) This setting refers to the amount of time, in seconds, it takes the characters eyelids to go from down to up. Decreasing the setting means that the eyelids snap up rather quickly; increasing it means that the eye opening is a much slower process.
LoadOnBoot=IfChanged
Step=0.01
VarName=fBlinkUpTime
type=slider
value=0.17
MinValue=0
MaxValue=100

