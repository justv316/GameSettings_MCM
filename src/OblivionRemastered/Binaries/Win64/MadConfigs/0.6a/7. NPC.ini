[NPC]
description=Settings that have affect NPC.
type=header

[Base Magicka Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.50
Description=(Float) Value is multiplied by the NPC's intelligence score to determine the NPC's magicka. NPCs do not have birth signs so this value is higher than for the player to compensate. Setting this value higher makes magic using enemies a lot tougher, since more magicka also means faster magicka regeneration.
LoadOnBoot=IfChanged
Step=0.05
VarName=fNPCBaseMagickaMult
type=slider
value=1.50
MinValue=0
MaxValue=300

[Base Health Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.50
Description=(Float) Affects how the health of the NPC is calculated based on level and endurance. Increasing this value gives NPCs more health.
LoadOnBoot=IfChanged
Step=0.05
VarName=fNPCAttributeHealthMult
type=slider
value=0.50
MinValue=0
MaxValue=300

[Health Bar Timer]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=2.50
Description=(Float) This is the amount of time in seconds that the health bar of an enemy displays after the cursor moves away.
LoadOnBoot=IfChanged
Step=0.05
VarName=fEnemyHealthBarTimer
type=slider
value=2.50
MinValue=0
MaxValue=300

[Essential Timer]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=10.0
Description=(Float) The time that an NPC marked essential will remain unconscious before getting back up.
LoadOnBoot=IfChanged
Step=0.5
VarName=fEssentialDeathTime
type=slider
value=10.0
MinValue=0
MaxValue=300

[Essential Health Regain]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.30
Description=(Float) The percent of maximum health an essential NPC will have remaining upon recovery.
LoadOnBoot=IfChanged
Step=0.05
VarName=fEssentialHealthPercentReGain
type=slider
value=0.30
MinValue=0
MaxValue=0

[Horse Distance]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=10000.0
Description=(Float) When told to go to a point farther away than this distance, an NPC will use a horse if one is available. Any point closer than this distance, and they will simply walk.
LoadOnBoot=IfChanged
Step=50
VarName=fMinDistanceUseHorse
type=slider
value=10000.0
MinValue=0
MaxValue=10000

[Flee Distance Exterior]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=2000.0
Description=(Float) Controls how far away an actor (NPC, creature) will run when it flees. Once the actor reaches this distance it will stop fleeing and, usually, just stand there. If you close the distance the actor will continue to flee to this maximum distance.
LoadOnBoot=IfChanged
Step=10
VarName=fFleeDistanceExterior
type=slider
value=2000.0
MinValue=0
MaxValue=50000

[Flee Distance Interior]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=300.0
Description=(Float) Controls how far away an actor (NPC, creature) will run when it flees. Once the actor reaches this distance it will stop fleeing and, usually, just stand there. If you close the distance the actor will continue to flee to this maximum distance.
LoadOnBoot=IfChanged
Step=10
VarName=fFleeDistanceInterior
type=slider
value=300.0
MinValue=0
MaxValue=50000

[Reaction Distance Exterior]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=600.0
Description=(Float) The distance at which a hostile actor (NPC, creature) will attack, assuming the actor has detected the player.
LoadOnBoot=IfChanged
Step=10
VarName=fDistanceExteriorReactCombat
type=slider
value=600.0
MinValue=0
MaxValue=50000

[Reaction Distance Interior]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=300.0
Description=(Float) The distance at which a hostile actor (NPC, creature) will attack, assuming the actor has detected the player.
LoadOnBoot=IfChanged
Step=10
VarName=fDistanceInteriorReactCombat
type=slider
value=300.0
MinValue=0
MaxValue=50000

[Hostile Distance Exterior]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=3000.0
Description=(Float) The distance in game units at which a hostile actor (NPC, creature) is considered close enough to disable fast traveling, waiting, or sleeping for the player.
