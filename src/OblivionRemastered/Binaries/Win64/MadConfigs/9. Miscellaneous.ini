[Stars]
description=Settings that affect Stars.
type=header

[Rotation Days]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=4.0
Description=(Float) This setting dictates how often the stars rotate in the sky. In particular, this setting is in days. If you set this to a very small setting, the stars will rotate far faster than normal. The speed of their rotation is determined using the other 3 variables, each dictating the number of rotations per period (for each axis). If you set RotateDays to 0.0004, and each of the Axis to 1, then, all 3 axis will make one full rotation every second (roughly). If all three rotation variables are set to zero, then the stars will fade in and out based on this setting.
LoadOnBoot=IfChanged
Step=0.5
VarName=fStarsRotateDays
type=slider
value=4.0
MinValue=0
MaxValue=300

[Rotation X Axis]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.0
Description=(Float) Determines how many rotations are made on the X axis per period (period is defined by FStarsRotateDays). The X axis will move around you like you are in a barrel (A curved pattern, going from right to left across the screen).
LoadOnBoot=IfChanged
Step=0.5
VarName=fStarsRotateXAxis
type=slider
value=0.0
MinValue=0
MaxValue=300

[Rotation Y Axis]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.0
Description=(Float) Determines how many rotations are made on the Y axis per period (period is defined by FStarsRotateDays). The Y axis will move around you like you are in a barrel (A curved pattern, going from right to left across the screen, depending on where you are facing).
LoadOnBoot=IfChanged
Step=0.5
VarName=fStarsRotateYAxis
type=slider
value=0.0
MinValue=0
MaxValue=300

[Rotation Z Axis]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.0
Description=(Float) Determines how many rotations are made on the X axis per period (period is defined by FStarsRotateDays). The Z axis will spin around above you, counterclockwise.
LoadOnBoot=IfChanged
Step=0.5
VarName=fStarsRotateZAxis
type=slider
value=1.0
MinValue=0
MaxValue=300

