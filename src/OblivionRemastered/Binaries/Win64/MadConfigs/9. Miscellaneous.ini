[Falling]
description=Settings that affect Falling.
type=header

[Skill Base]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.25
Description=(Float) Final falling damage is determined based on several factors, most notably fJumpFallTimeMult. |  Formula: base damage * (fJumpFallSkillBase - (Acrobatics * fJumpFallSkillMult / 100))
LoadOnBoot=IfChanged
Step=0.05
VarName=fJumpFallSkillBase
type=slider
value=1.25
MinValue=-100
MaxValue=300

[Skill Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=-0.0100
Description=(Float) Final falling damage is determined based on several factors, most notably fJumpFallTimeMult. |  Formula: base damage * (fJumpFallSkillBase - (Acrobatics * fJumpFallSkillMult / 100))
LoadOnBoot=IfChanged
Step=0.05
VarName=fJumpFallSkillMult
type=slider
value=-0.0100
MinValue=-100
MaxValue=300

[Time Base]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.0
Description=(Float) Appears to be the minimum amount of damage taken in a fall, regardless of time spent falling. Note that a certain threshold of vertical distance has to be passed before it's considered a fall. Further experimentation may reveal other GMSTs which control this.
LoadOnBoot=IfChanged
Step=0.05
VarName=fJumpFallTimeBase
type=slider
value=0.0
MinValue=-100
MaxValue=300

[Time Minimum]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.200
Description=(Float) Falling damage is calculated by time in seconds spent falling; see fJumpFallTimeMult. This setting appears to be the minimum time spent falling before damage is assigned at all. However, setting it to 0.0 does not cause you to take damage by stepping off a curb, so there must be an additional factor in determining whether or not you've fallen.
LoadOnBoot=IfChanged
Step=0.05
VarName=fJumpFallTimeMin
type=slider
value=0.200
MinValue=-100
MaxValue=300

[Time Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=80.0
Description=(Float) The base amount of damage taken per second of falling. This is adjusted by fJumpFallSkillBase and fJumpFallSkillMult.
LoadOnBoot=IfChanged
Step=1
VarName=fJumpFallTimeMult
type=slider
value=80.000
MinValue=-100
MaxValue=300

[Velocity Minimum]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=600.0
Description=(Float) This seems to influence how quickly actors fall through the air.
LoadOnBoot=IfChanged
Step=5
VarName=fJumpFallVelocityMin
type=slider
value=600.000
MinValue=-10000
MaxValue=3000

[Height Maximum]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=164.0
Description=(Float) This number sets the height of a jump made by a character with an Acrobatics skill of 100. This number must be higher than fJumpHeightMin (default 64.0000). | Formula: fJumpHeightMin + (Acrobatics * (fJumpHeightMax - fJumpHeightMin) / 100)
LoadOnBoot=IfChanged
Step=0.5
VarName=fJumpHeightMax
type=slider
value=164.000
MinValue=-3000
MaxValue=3000

[Height Minimum]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=64.0
Description=(Float) This number sets absolute minimum for any jump the player under any circumstances, including the case when Acrobatics skill is 0. This number must be lower than fJumpHeightMax (default 164.0000).
LoadOnBoot=IfChanged
Step=0.5
VarName=fJumpHeightMin
type=slider
value=64.000
MinValue=-3000
MaxValue=3000

[Air Movement Base]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.0
Description=(Float) This is the base value of how much control you have over moving/controlling the direction of your character while in the air. The final value is also affected by fJumpMoveMult.
LoadOnBoot=IfChanged
Step=0.5
VarName=fJumpMoveBase
type=slider
value=0.000
MinValue=-3000
MaxValue=3000

[Air Movement Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.30
Description=(Float) This number is a multiplier or 'weight' that affects the fJumpMoveBase value to determine how much 'in-flight' directional control you have over your character.
LoadOnBoot=IfChanged
Step=0.05
VarName=fJumpMoveBase
type=slider
value=0.300
MinValue=-300
MaxValue=300

[Camera]
description=Settings that affect the Camera.
type=header

[Wheel Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.1
Description=(Float) Determines how many rotations are made on the X axis per period (period is defined by FStarsRotateDays). The Z axis will spin around above you, counterclockwise.
LoadOnBoot=IfChanged
Step=0.05
VarName=fVanityModeWheelMult
type=slider
value=0.1
MinValue=-100
MaxValue=300

[Wheel Maximum]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=600
Description=(Float) This is the maximum distance from the camera to the center of the player while in Vanity Mode. Distance is based on the Coordinate in the game, same on all 3 axis. Increasing the number should allow you to have the camera further than normal.
LoadOnBoot=IfChanged
Step=5
VarName=fVanityModeWheelMax
type=slider
value=600
MinValue=-1000
MaxValue=3000

[Wheel Minimum]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=30
Description=(Float) This is the minimum distance from the player the camera can be set when you are in Vanity Mode. Distance is the value according to the coordinate system in the game, on all 3 Axis. Since the height of the player is more than 30, the minimum Z distance clips through the player.
LoadOnBoot=IfChanged
Step=1
VarName=fVanityModeWheelMin
type=slider
value=30
MinValue=-1000
MaxValue=3000

[X Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=30
Description=(Float) Refers to the multiplier that controls of the speed you move the camera on the X axis (The speed that the camera spins around your character while in Vanity Mode, not the same as the X axis for the Coordinate system on the map). Increasing or decreasing the multiplier will increase or decrease the distance traveled by the camera as it spins around your character.
LoadOnBoot=IfChanged
Step=1
VarName=fVanityModeXMult
type=slider
value=30
MinValue=-1000
MaxValue=3000

[Y Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=10.00
Description=(Float) This setting controls the multiplier for the Y axis (Y axis meaning going up and over your character, not the same Y axis as the coordinate system on the map). Increasing or decreasing this number will increase or decrease the distance traveled by the camera while in Vanity Mode.
LoadOnBoot=IfChanged
Step=0.5
VarName=fVanityModeYMult
type=slider
value=10.00
MinValue=-1000
MaxValue=3000

[Vanity Delay]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=0.50
Description=(Float) This setting changes the delay period between going from 3rd person to Vanity Mode. In particular, it determines how long you hold down "R" before you make the switch. If you set it to zero, when you are in first person mode, and you press R, you will go straight to Vanity Mode, instead of 3rd person. You can still go into third person mode via the scroll wheel, but you can't use "R" for 3rd person mode once this has been set to zero.
LoadOnBoot=IfChanged
Step=0.05
VarName=fVanityModeDelay
type=slider
value=0.50
MinValue=-1000
MaxValue=3000

[Chanse Z Units]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=300.00
Description=(Float) Distance in units per second the third person chase camera zooms back to its set value. If the value of the Game Setting fVanityModeWheelMax is increased, increasing the value of this variable proportionately helps reach the desired zoom distance quickly.
LoadOnBoot=IfChanged
Step=1
VarName=fChase3rdPersonZUnitsPerSecond
type=slider
value=300.00
MinValue=-1000
MaxValue=3000