Description=(Float) Multiplier used to calculate the Duration of hostile type 1 effects on player made potions made with an Alembic. Type 1 effects are those with both magnitude and duration (e.g. Damage Magicka). Increasing it will decrease the strength of the effect, and decreasing it will increase the strength.
