[Tier 1 Magnitude Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=2.5
Description=(Float) Multiplier used to calculate the Magnitude and Duration of any type 1 effects on all player made potions. Type 1 effects are those with both magnitude and duration (e.g. Damage Magicka). With other default game settings, increasing it will increase the strength and decrease the duration of the effect, and decreasing it will decrease the strength and increase duration.
LoadOnBoot=IfChanged
Step=0.05
VarName=fPotionT1MagMult
