[Wortcraft]
description=Settings that have affect wortcraft (Eating Ingredients).
type=header

[Alchemy Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=1.0
Description=(Float) When using wortcraft, the player's Alchemy is multiplied by this setting, then divided by 5. (Divisor possibly controlled by another setting?) The wortcraft effect is calculated as a potion created by an alchemist with the resulting skill and no equipment bonuses.
LoadOnBoot=IfChanged
Step=0.1
VarName=fWortAlchMult
type=slider
value=1.0
MinValue=-100
MaxValue=100

[Fatigue Magnitude]
CommandOverride=SetGameSetting ((varname)) ((value))
DefaultValue=5.0
Description=(Float) When an ingredient with the Food property is eaten, the normal wortcraft calculation is skipped and it instead produces an effect with a duration of 1 second and magnitude equal to this setting. (Don't be confused by the name: most food has the Restore Fatigue effect, but this setting affects all food, and non-food Restore Fatigue ingredients are not affected.) Note: Setting the duration of the ingredient effect to zero appears to double the resulting magnitude. Bread, for example, has its Restore Fatigue effect duration set to 0, unlike the majority of ingredients. It restores 10 fatigue instead of 5.
LoadOnBoot=IfChanged
Step=0.1
VarName=fWortcraftFatigueMag
type=slider
value=5.0
MinValue=-100
MaxValue=100

