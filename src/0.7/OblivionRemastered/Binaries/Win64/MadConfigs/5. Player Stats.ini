[Health]
type=header
description=Settings that affect the players health. (https://cs.uesp.net/wiki/Health)

[Base Health Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
ValueOverride=GetGameSetting ((varname))
DefaultValue=2.0
Description=(Float) Affects the health of the player at the start of the game. Value is multiplied by the player's endurance to calculate starting health. Has no effect on health when the player levels up unless the player gains Endurance that level, in which case the player's base health will be recalculated according to this setting. | Formula: Endurance * fPCBaseHealthMult * fStatsHealthStartMult
LoadOnBoot=IfChanged
Step=0.5
VarName=fPCBaseHealthMult
type=slider
value=2.0
MinValue=0
MaxValue=20

[Base Health Start Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
ValueOverride=GetGameSetting ((varname))
DefaultValue=1.0
Description=(Float) Multiplier used in the Base Health calculation | Formula: Endurance * fPCBaseHealthMult * fStatsHealthStartMult
LoadOnBoot=IfChanged
Step=0.5
VarName=fStatsHealthStartMult
type=slider
value=1.0
MinValue=0
MaxValue=20

[Health Level Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
ValueOverride=GetGameSetting ((varname))
DefaultValue=0.1
Description=(Float) The number by which the player's endurance is multiplied to calculate the amount of health to be added when the character levels up. The value produced is rounded down to the nearest whole number. If this value is set to 0.0, character health will be based directly on endurance, with no level bonuses. This only affects the player. | Formula: Endurance * fStatsHealthLevelMult
LoadOnBoot=IfChanged
Step=0.5
VarName=fStatsHealthLevelMult
type=slider
value=0.1
MinValue=0
MaxValue=20

