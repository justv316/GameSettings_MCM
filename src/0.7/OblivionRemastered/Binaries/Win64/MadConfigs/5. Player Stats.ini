value=5
MinValue=0
MaxValue=200

[Skill Use Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
ValueOverride=GetGameSetting ((varname))
DefaultValue=1.5
Description=(Float) Controls the amount of experience needed to gain a level in any skill. Higher values of this setting require exponentially more experience for skills to increase. This affects experience requirements at all skill values, but will have most impact for high skill values. | Formula: The experience required to increase a skill is proportional to: fSkillUseFactor x skillValue ^ fSkillUseExp | This is then multiplied by fSkillUseMajorMult or fSkillUseMinorMult. For skills of the player's specialization, it is then multiplied by fSkillUseSpecMult. | Reloading a saved game after changing this value will affect the amount of current experience in every skill.
LoadOnBoot=IfChanged
Step=0.05
VarName=fSkillUseExp
type=slider
value=1.5
MinValue=0
MaxValue=200

[Skill Use Factor]
CommandOverride=SetGameSetting ((varname)) ((value))
ValueOverride=GetGameSetting ((varname))
DefaultValue=0.35
Description=(Float) Controls the amount of experience needed to gain a level in any skill, with higher values requiring more experience per level, and lower values requiring less experience per level. This is a linear multiplier.
LoadOnBoot=IfChanged
Step=0.005
VarName=fSkillUseFactor
type=slider
value=0.35
MinValue=0
MaxValue=200

[Major Skill Use Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
ValueOverride=GetGameSetting ((varname))
DefaultValue=0.750
Description=(Float) Modifies the number of times you need to use one of your 7 major skills in order to get a skill increase. The base number of uses depends on the level of the skill and other (unknown) factors.
LoadOnBoot=IfChanged
Step=0.005
VarName=fSkillUseMajorMult
type=slider
value=0.75
MinValue=0
MaxValue=200

[Minor Skill Use Multiplier]
CommandOverride=SetGameSetting ((varname)) ((value))
ValueOverride=GetGameSetting ((varname))
DefaultValue=0.875
Description=(Float) Modifies the number of times you need to use one of your 14 minor skills in order to get a skill increase. The base number of uses depends on the level of the skill and other (unknown) factors. A higher value means the skill has to be used more to get an increase.
LoadOnBoot=IfChanged
Step=0.005
VarName=fSkillUseMinorMult
type=slider
value=0.875
MinValue=0
MaxValue=200

[Specialized Skill Use Multiplier]
